<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SaaS Pricing Page</title>
<link rel="stylesheet" href="../assets/css/style.css">

</head>
<body>

<nav class="site-nav">
  <span class="brand">Practical Programs Lab</span>
  <a href="../index.html">Home</a>
  <a href="index.html">Back to CSS Programs</a>
</nav>

<main>
  <header class="program-head">
    <p class="kicker">CSS Program 261</p>
    <h1>SaaS Pricing Page</h1>
    <p class="desc">A full pricing page with a monthly/yearly toggle and three plan cards.</p>
  </header>

  <section class="panel">
    <h3>Demo</h3>
    <div style="text-align:center; margin-bottom:1rem;">
      <div style="display:inline-flex; background:var(--paper-raised); border:1px solid var(--rule); border-radius:999px; padding:4px;">
        <button class="btn" style="background:var(--pine); padding:0.4rem 0.9rem; font-size:0.85rem;">Monthly</button>
        <button class="btn" style="background:none; color:var(--ink); padding:0.4rem 0.9rem; font-size:0.85rem;">Yearly</button>
      </div>
    </div>
    <div style="display:flex; gap:0.8rem; flex-wrap:wrap;">
      <div style="flex:1; min-width:110px; background:#fff; border:1px solid var(--rule); border-radius:8px; padding:0.9rem; text-align:center;">Starter<br>$9</div>
      <div style="flex:1; min-width:110px; background:#fff; border:2px solid var(--pine); border-radius:8px; padding:0.9rem; text-align:center;">Pro<br>$29</div>
      <div style="flex:1; min-width:110px; background:#fff; border:1px solid var(--rule); border-radius:8px; padding:0.9rem; text-align:center;">Enterprise<br>Contact</div>
    </div>
  </section>

  <section class="panel code-panel">
    <h3>Source</h3>
    <pre><code>.pricing-toggle{ display:inline-flex; border-radius:999px; }</code></pre>
  </section>

  <nav class="page-links">
    <a href="../index.html">Home</a>
    <a href="index.html">Back to CSS Programs</a>
  </nav>
</main>

</body>
</html>
