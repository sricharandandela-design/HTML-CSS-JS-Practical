  <header class="program-head">
    <p class="kicker">CSS Program 193</p>
    <h1>Developer Settings</h1>
    <p class="desc">Toggles aimed at developers: sandbox mode, webhooks, and raw request logging.</p>
  </header>

  <section class="panel">
    <h3>Demo</h3>
    <div style="max-width:300px; font-size:0.88rem;">
      <label style="display:block; margin-bottom:0.5rem;"><input type="checkbox" checked> Enable sandbox mode</label>
      <label style="display:block; margin-bottom:0.5rem;"><input type="checkbox"> Log raw API requests</label>
      <label style="display:block;"><input type="checkbox" checked> Send webhook retries</label>
    </div>
  </section>

  <section class="panel code-panel">
    <h3>Source</h3>
    <pre><code>.developer-settings label{ display:block; }</code></pre>
