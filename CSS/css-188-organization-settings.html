<main>
  <header class="program-head">
    <p class="kicker">CSS Program 188</p>
    <h1>Organization Settings</h1>
    <p class="desc">Company-wide settings: name, domain, and default timezone.</p>
  </header>

  <section class="panel">
    <h3>Demo</h3>
    <div style="max-width:300px;">
      <div class="field"><label>Organization name</label><input type="text" value="Northwind Labs"></div>
      <div class="field"><label>Domain</label><input type="text" value="northwindlabs.com"></div>
      <div class="field"><label>Default timezone</label><select><option>IST (UTC+5:30)</option><option>UTC</option></select></div>
    </div>
  </section>

  <section class="panel code-panel">
    <h3>Source</h3>
    <pre><code>.org-settings .field input[readonly]{ background:#EDEFE9; } /* domain often locked after verification */</code></pre>
  </section>
