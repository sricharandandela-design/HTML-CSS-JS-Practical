<main>
  <header class="program-head">
    <p class="kicker">CSS Program 183</p>
    <h1>Account Settings</h1>
    <p class="desc">A simple settings form for name, email, and language preference.</p>
  </header>

  <section class="panel">
    <h3>Demo</h3>
    <div style="max-width:300px;">
      <div class="field"><label>Full name</label><input type="text" value="Ananya Rao"></div>
      <div class="field"><label>Email</label><input type="email" value="ananya@example.com"></div>
      <div class="field"><label>Language</label><select><option>English</option><option>Hindi</option></select></div>
      <button class="btn">Save changes</button>
    </div>
  </section>

  <section class="panel code-panel">
    <h3>Source</h3>
    <pre><code>.settings-form .field{ margin-bottom:1rem; }</code></pre>
  </section>

  <nav class="page-links">
