  <header class="program-head">
    <p class="kicker">CSS Program 194</p>
    <h1>Security Settings</h1>
    <p class="desc">Password change, login alerts toggle, and a link to view active sessions.</p>
  </header>

  <section class="panel">
    <h3>Demo</h3>
    <div style="max-width:300px;">
      <div class="field"><label>Current password</label><input type="password"></div>
      <div class="field"><label>New password</label><input type="password"></div>
      <label style="display:block; font-size:0.85rem; margin-bottom:0.6rem;"><input type="checkbox" checked> Email me on new logins</label>
      <button class="btn">Update security settings</button>
    </div>
  </section>

  <section class="panel code-panel">
    <h3>Source</h3>
    <pre><code>.security-settings input[type="password"]{ font-family: monospace; }</code></pre>
  </section>
