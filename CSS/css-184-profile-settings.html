<!DOCTYPE html>
<html lang="en">
<head>

<main>
  <header class="program-head">
    <p class="kicker">CSS Program 184</p>
    <h1>Profile Settings</h1>
    <p class="desc">Avatar upload plus a short bio field, the public-facing part of an account.</p>
  </header>

  <section class="panel">
    <h3>Demo</h3>
    <div style="max-width:300px;">
      <div style="display:flex; align-items:center; gap:0.8rem; margin-bottom:0.8rem;">
        <img src="https://placehold.co/56x56/3F6C5D/ffffff?text=AR" style="border-radius:50%;">
        <button class="btn" style="padding:0.4rem 0.8rem; font-size:0.85rem;">Change photo</button>
      </div>
      <div class="field"><label>Bio</label><textarea rows="3">Product designer based in Chennai.</textarea></div>
    </div>
  </section>

  <section class="panel code-panel">
    <h3>Source</h3>
    <pre><code>.avatar-upload{ display:flex; align-items:center; gap:0.8rem; }</code></pre>
  </section>

  <nav class="page-links">
    <a href="../index.html">Home</a>
    <a href="index.html">Back to CSS Programs</a>
