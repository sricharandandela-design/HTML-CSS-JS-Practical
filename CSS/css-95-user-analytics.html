<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Analytics</title>
<link rel="stylesheet" href="../assets/css/style.css">

</head>
<body>

<nav class="site-nav">
  <span class="brand">Practical Programs Lab</span>
  <a href="../index.html">Home</a>
  <a href="index.html">Back to CSS Programs</a>
</nav>

<main>
  <header class="program-head">
    <p class="kicker">CSS Program 95</p>
    <h1>User Analytics</h1>
    <p class="desc">Daily/weekly/monthly active user counts side by side.</p>
  </header>

  <section class="panel">
    <h3>Demo</h3>
    <style>
      .cd{ background:#fff; border:1px solid var(--rule); border-radius:10px; padding:1rem; }
      .kpi-row{ display:flex; gap:0.8rem; flex-wrap:wrap; margin-bottom:1rem; }
      .kpi-tile{ flex:1; min-width:120px; }
      .kpi-tile .label{ font-size:0.75rem; color:#55605B; }
      .kpi-tile .value{ font-size:1.3rem; font-weight:700; }
      .bars{ display:flex; align-items:flex-end; gap:6px; height:80px; }
      .bars div{ flex:1; background:var(--pine); border-radius:3px 3px 0 0; }
    </style>
    <div class="cd">
      <div class="kpi-row">
        <div class="kpi-tile"><div class="label">DAU</div><div class="value">1,204</div></div>
        <div class="kpi-tile"><div class="label">WAU</div><div class="value">5,830</div></div>
        <div class="kpi-tile"><div class="label">MAU</div><div class="value">18,942</div></div>
      </div>
      <p style="font-size:0.8rem; color:var(--pine); font-weight:600;">DAU/MAU stickiness ratio: 6.4%</p>
    </div>
  </section>

  <section class="panel code-panel">
    <h3>Source</h3>
    <pre><code>.user-analytics .kpi-row{ display:flex; gap:0.8rem; }</code></pre>
  </section>

  <nav class="page-links">
    <a href="../index.html">Home</a>
    <a href="index.html">Back to CSS Programs</a>
  </nav>
</main>

</body>
</html>
