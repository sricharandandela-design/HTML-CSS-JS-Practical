<main>
  <header class="program-head">
    <p class="kicker">CSS Program 175</p>
    <h1>ML Model Performance Dashboard</h1>
    <p class="desc">Accuracy, precision, and recall shown as a small set of KPI tiles.</p>
  </header>

  <section class="panel">
    <h3>Demo</h3>
    <div style="display:flex; gap:0.8rem;">
      <div style="flex:1; background:#fff; border:1px solid var(--rule); border-radius:8px; padding:0.7rem; text-align:center;">
        <div style="font-size:0.75rem; color:#55605B;">Accuracy</div><div style="font-size:1.2rem; font-weight:700;">94.2%</div></div>
      <div style="flex:1; background:#fff; border:1px solid var(--rule); border-radius:8px; padding:0.7rem; text-align:center;">
        <div style="font-size:0.75rem; color:#55605B;">Precision</div><div style="font-size:1.2rem; font-weight:700;">91.8%</div></div>
      <div style="flex:1; background:#fff; border:1px solid var(--rule); border-radius:8px; padding:0.7rem; text-align:center;">
        <div style="font-size:0.75rem; color:#55605B;">Recall</div><div style="font-size:1.2rem; font-weight:700;">88.5%</div></div>
    </div>
  </section>

  <section class="panel code-panel">
    <h3>Source</h3>
    <pre><code>.perf-tile{ text-align:center; flex:1; }</code></pre>
  </section>
