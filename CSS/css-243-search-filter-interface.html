<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SaaS Search and Filter Interface</title>
<link rel="stylesheet" href="../assets/css/style.css">

</head>
<body>

<nav class="site-nav">
  <span class="brand">Practical Programs Lab</span>
  <a href="../index.html">Home</a>
  <a href="index.html">Back to CSS Programs</a>
</nav>

<main>
  <header class="program-head">
    <p class="kicker">CSS Program 243</p>
    <h1>SaaS Search and Filter Interface</h1>
    <p class="desc">A search bar paired with filter chips that narrow the result set.</p>
  </header>

  <section class="panel">
    <h3>Demo</h3>
    <input type="text" placeholder="Search projects..." style="width:100%; max-width:300px; padding:0.5rem; border:1px solid var(--rule); border-radius:6px; margin-bottom:0.6rem;">
    <div style="display:flex; gap:0.5rem;">
      <span style="background:var(--pine); color:#fff; padding:0.25rem 0.7rem; border-radius:999px; font-size:0.8rem;">Active &times;</span>
      <span style="background:var(--paper); padding:0.25rem 0.7rem; border-radius:999px; font-size:0.8rem;">This week</span>
    </div>
  </section>

  <section class="panel code-panel">
    <h3>Source</h3>
    <pre><code>.filter-chip.active{ background:#3F6C5D; color:#fff; }</code></pre>
  </section>

  <nav class="page-links">
    <a href="../index.html">Home</a>
    <a href="index.html">Back to CSS Programs</a>
  </nav>
</main>

</body>
</html>
