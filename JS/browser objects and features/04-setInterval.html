<!DOCTYPE html>
<html><body><h2>setInterval()</h2><button onclick="start()">Start</button><button onclick="stop()">Stop</button>
<p id="out">0</p><script>
let n=0, timer;
function start(){ if(!timer) timer=setInterval(()=>document.getElementById("out").textContent=++n,1000); }
function stop(){ clearInterval(timer); timer=null; }
</script>
