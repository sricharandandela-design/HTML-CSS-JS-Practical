<!DOCTYPE html>
<html><body><h2>Stopwatch</h2><h1 id="out">00:00:00</h1>
<button onclick="start()">Start</button><button onclick="stop()">Stop</button><button onclick="reset()">Reset</button>
<script>
let sec=0,timer;
function show(){let h=String(Math.floor(sec/3600)).padStart(2,"0"),m=String(Math.floor(sec%3600/60)).padStart(2,"0"),s=String(sec%60).padStart(2,"0");out.textContent=`${h}:${m}:${s}`;}
function start(){if(!timer)timer=setInterval(()=>{sec++;show()},1000)} function stop(){clearInterval(timer);timer=null}
function reset(){stop();sec=0;show()} show();
</script>
