<!DOCTYPE html>
<html><body><h2>Browser Geolocation</h2><button onclick="getLocation()">Get Location</button><p id="out"></p><script>
function getLocation(){if(!navigator.geolocation){out.textContent="Geolocation not supported";return;}
navigator.geolocation.getCurrentPosition(p=>out.textContent="Latitude: "+p.coords.latitude+"\nLongitude: "+p.coords.longitude,
e=>out.textContent="Permission denied or location unavailable.");}
</script>
