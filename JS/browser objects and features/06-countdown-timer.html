<!DOCTYPE html>
<html><body><h2>Countdown Timer</h2><input id="seconds" type="number" min="1" value="10">
<button onclick="start()">Start</button><h1 id="out">10</h1><script>
let t;
function start(){ clearInterval(t); let n=Number(document.getElementById("seconds").value);
document.getElementById("out").textContent=n;
t=setInterval(()=>{ document.getElementById("out").textContent=n;
if(n--<=0){clearInterval(t);document.getElementById("out").textContent="Time's up!";}},1000);}
</script>
