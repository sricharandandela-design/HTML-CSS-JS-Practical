<!DOCTYPE html>
<html><body><h2>Alert, Confirm and Prompt</h2>
<button onclick="demo()">Run Demo</button>
<p id="out"></p>
<script>
function demo() {
  alert("Hello!");
  const ok = confirm("Do you want to continue?");
  if (ok) {
    const name = prompt("Enter your name:");
    document.getElementById("out").textContent = "Hello, " + (name || "Guest") + "!";
  } else document.getElementById("out").textContent = "You cancelled.";
}
</script>
