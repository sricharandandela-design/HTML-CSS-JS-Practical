<html><body><h2>Current Coordinates</h2><button onclick="show()">Show Coordinates</button><p id="out"></p><script>
function show(){navigator.geolocation.getCurrentPosition(p=>out.textContent=`Latitude: ${p.coords.latitude}, Longitude: ${p.coords.longitude}`,
e=>out.textContent="Could not get coordinates.");}
</script>
