<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create a Student Management CRUD application.</title>
<style>body{font-family:Arial,sans-serif;max-width:900px;margin:40px auto;padding:20px;line-height:1.5}button,input{padding:10px;margin:5px}pre{background:#f4f4f4;padding:15px;overflow:auto}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body>
<h1>Create a Student Management CRUD application.</h1><p>Supabase Client CRUD example.</p>
<button onclick="run()">Run CRUD demo</button><pre id="out"></pre>
<script>
const SUPABASE_URL='https://YOUR-PROJECT.supabase.co';
const SUPABASE_ANON_KEY='YOUR_ANON_KEY';
const client=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

async function run(){
  const out=document.getElementById('out');
  const {data,error}=await client.from('students').select('*').limit(10);
  out.textContent=error ? error.message : JSON.stringify(data,null,2);
}
</script>
