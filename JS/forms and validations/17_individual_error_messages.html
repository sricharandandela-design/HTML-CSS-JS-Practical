<label>Email <input id="email"><span id="emailErr"></span></label><br>
<button>Submit</button></form>
<script>f.onsubmit=e=>{e.preventDefault();nameErr.textContent=/^[A-Za-z ]+$/.test(name.value.trim())?"":" Invalid name";emailErr.textContent=/^\S+@\S+\.\S+$/.test(email.value.trim())?"":" Invalid email";};</script>
