<!DOCTYPE html>
<html><body><h2>College Admission Form</h2><form id="f">
<input id="name" required placeholder="Full Name"><br><input id="email" required type="email" placeholder="Email"><br>
<input id="phone" required placeholder="10-digit Phone"><br><input id="marks" required type="number" min="0" max="100" placeholder="12th Marks %"><br>
<select id="course" required><option value="">Choose Course</option><option>B.Tech CSE</option><option>B.Tech Data Science</option></select><br>
<button>Apply</button></form><p id="msg"></p>
<script>f.onsubmit=e=>{e.preventDefault();if(f.checkValidity()&&/^\d{10}$/.test(phone.value))msg.textContent="Admission form is valid and ready to submit.";else msg.textContent="Please correct all fields.";};</script>
