<!DOCTYPE html>
<html><body><input id="pw" type="password" placeholder="Strong password"><button onclick="check()">Validate</button><p id="msg"></p>
<script>function check(){let p=pw.value;let ok=p.length>=8&&/[A-Z]/.test(p)&&/[a-z]/.test(p)&&/\d/.test(p)&&/[^A-Za-z0-9]/.test(p);msg.textContent=ok?"Strong password":"Use 8+ chars with upper, lower, number and special character.";}</script>
