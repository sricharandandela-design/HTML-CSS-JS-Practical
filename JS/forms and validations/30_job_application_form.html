<!DOCTYPE html>
<html><body><h2>Job Application</h2><form id="f">
<input id="name" required placeholder="Full Name"><br><input id="email" required type="email" placeholder="Email"><br>
<input id="phone" required placeholder="Phone"><br><input id="exp" required type="number" min="0" placeholder="Years of Experience"><br>
<textarea id="skills" required placeholder="Skills"></textarea><br><button>Apply</button></form><p id="msg"></p>
<script>f.onsubmit=e=>{e.preventDefault();msg.textContent=f.checkValidity()?"Application submitted successfully.":"Please complete all fields.";};</script>
