<!DOCTYPE html>
<html><body><input id="dob" type="date"><button onclick="calculate()">Calculate Age</button><p id="msg"></p>
<script>function calculate(){let d=new Date(dob.value),t=new Date();let age=t.getFullYear()-d.getFullYear();let m=t.getMonth()-d.getMonth();if(m<0||(m===0&&t.getDate()<d.getDate()))age--;msg.textContent=age>=0?"Age: "+age:"Select a valid date.";}</script>
