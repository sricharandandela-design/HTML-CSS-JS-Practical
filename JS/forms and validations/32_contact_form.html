<!DOCTYPE html>
<html><body><h2>Contact Form</h2><form id="f">
<input id="name" required placeholder="Name"><br><input id="email" required type="email" placeholder="Email"><br>
<textarea id="message" required minlength="10" placeholder="Message"></textarea><br><button>Send</button></form><p id="msg"></p>
<script>f.onsubmit=e=>{e.preventDefault();msg.textContent=f.checkValidity()?"Message sent successfully!":"Please enter valid contact details.";};</script>
