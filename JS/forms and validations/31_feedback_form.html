<!DOCTYPE html>
<html><body><h2>Feedback Form</h2><form id="f">
<input id="name" required placeholder="Name"><br><select id="rating" required><option value="">Rating</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select><br>
<textarea id="feedback" required minlength="10" placeholder="Your feedback"></textarea><br><button>Send Feedback</button></form><p id="msg"></p>
<script>f.onsubmit=e=>{e.preventDefault();msg.textContent=f.checkValidity()?"Thank you for your feedback!":"Please complete the form.";};</script>
