<!DOCTYPE html>
<html><body><h2>Multi-Step Registration</h2>
<form id="f">
<section id="s1"><input id="name" required placeholder="Name"><button type="button" onclick="next(1)">Next</button></section>
<section id="s2" style="display:none"><input id="email" required type="email" placeholder="Email"><button type="button" onclick="next(2)">Next</button></section>
<section id="s3" style="display:none"><input id="pw" required type="password" minlength="8" placeholder="Password"><button>Register</button></section>
</form><p id="msg"></p>
<script>
function next(n){let sec=document.getElementById("s"+n),input=sec.querySelector("input");if(!input.checkValidity()){input.reportValidity();return;}sec.style.display="none";document.getElementById("s"+(n+1)).style.display="block";}
f.onsubmit=e=>{e.preventDefault();msg.textContent="Registration completed successfully!";};
</script>
<div style="
    margin: 20px 0;
    padding: 12px;
    text-align: center;
    background: #f4f6f8;
    border-radius: 10px;
">

       style="
       display:inline-block;
       margin-right:10px;
       padding:10px 18px;
       background:#2563eb;
       color:white;
       text-decoration:none;
       border-radius:7px;
       font-weight:bold;
       ">

    </a>

       ">
       Back to Programs
    </a>
</div>

</body></html>
