<!DOCTYPE html>
<html><body><h2>Marks Entry</h2>
<input id="a" type="number" placeholder="Subject 1"><input id="b" type="number" placeholder="Subject 2"><input id="c" type="number" placeholder="Subject 3"><br>
<button onclick="calc()">Calculate</button><p id="msg"></p>
<script>function calc(){let x=+a.value,y=+b.value,z=+c.value,total=x+y+z,avg=total/3,grade=avg>=90?"A+":avg>=80?"A":avg>=70?"B":avg>=60?"C":avg>=50?"D":"F";msg.innerHTML="Total: "+total+"<br>Average: "+avg.toFixed(2)+"<br>Grade: "+grade;}</script>

    margin: 20px 0;
    padding: 12px;
    text-align: center;
    background: #f4f6f8;
    border-radius: 10px;
">
