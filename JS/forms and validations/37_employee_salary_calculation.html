<!DOCTYPE html>
<html><body><h2>Employee Salary</h2>
<input id="basic" type="number" placeholder="Basic Salary"><button onclick="calc()">Calculate</button><p id="msg"></p>
<script>function calc(){let b=+basic.value,da=b*.20,ta=b*.10,gross=b+da+ta,ded=gross*.05,net=gross-ded;msg.innerHTML="DA: "+da.toFixed(2)+"<br>TA: "+ta.toFixed(2)+"<br>Gross: "+gross.toFixed(2)+"<br>Deduction: "+ded.toFixed(2)+"<br>Net Salary: "+net.toFixed(2);}</script>
<div style="
    margin: 20px 0;
    padding: 12px;
    text-align: center;
    background: #f4f6f8;
    border-radius: 10px;
">
    <a href="../index.html"
       style="
       display:inline-block;
       margin-right:10px;
       padding:10px 18px;
       background:#2563eb;
       color:white;
       text-decoration:none;
       border-radius:7px;
       font-weight:bold;
       ">
       Home
    </a>

    <a href="index.html"
       style="

    </a>
</div>

</body></html>
