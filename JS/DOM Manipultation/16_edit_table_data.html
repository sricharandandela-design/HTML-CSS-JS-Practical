<tr><th>Name</th><th>Action</th></tr>
<tr><td contenteditable="true">Charan</td><td><button onclick="edit(this)">Edit</button></td></tr>
<tr><td contenteditable="true">Rahul</td><td><button onclick="edit(this)">Edit</button></td></tr>
</table>
<script>
function edit(button) {
    const cell = button.closest("tr").cells[0];
    cell.contentEditable = "true";
    cell.focus();
    button.textContent = "Saved";
}
</script>
