<!DOCTYPE html>
<html>
<head><style>
#tip{display:none;position:absolute;background:#222;color:#fff;padding:6px}
</style></head>
<body>
<button id="button">Hover me</button>
<div id="tip">This tooltip was created with DOM manipulation.</div>
<script>
const button = document.getElementById("button");
const tip = document.getElementById("tip");
button.addEventListener("mouseenter", e => {
    tip.style.display = "block";
    tip.style.left = e.pageX + "px";
    tip.style.top = e.pageY + "px";
});
button.addEventListener("mouseleave", () => tip.style.display = "none");
</script>

    margin: 20px 0;
    padding: 12px;
