<!DOCTYPE html>

<body>
<textarea id="text" maxlength="100" rows="5" cols="40"></textarea>
<p>Characters: <span id="count">0</span>/100</p>
<script>
document.getElementById("text").addEventListener("input", function() {
    document.getElementById("count").textContent = this.value.length;
});
</script>
