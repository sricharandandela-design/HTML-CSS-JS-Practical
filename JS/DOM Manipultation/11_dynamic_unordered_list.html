<!DOCTYPE html>
<html>
<body>
<h3>Dynamic Unordered List</h3>
<ul id="list"></ul>
<script>
const items = ["HTML", "CSS", "JavaScript", "Python"];
const list = document.getElementById("list");
items.forEach(item => {
    const li = document.createElement("li");
    li.textContent = item;
    list.appendChild(li);
});
</script>
