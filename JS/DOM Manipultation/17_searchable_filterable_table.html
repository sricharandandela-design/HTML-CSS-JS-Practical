<!DOCTYPE html>
<html>
<body>
<input id="search" placeholder="Search students" onkeyup="filterTable()">
<table border="1" id="table">
<tr><th>Name</th><th>Course</th></tr>
<tr><td>Charan</td><td>CSE</td></tr>
<tr><td>Rahul</td><td>ECE</td></tr>
<tr><td>Anu</td><td>CSE</td></tr>
</table>
<script>
function filterTable() {
    const value = document.getElementById("search").value.toLowerCase();
    const rows = document.querySelectorAll("#table tr:not(:first-child)");
    rows.forEach(row => row.style.display = row.textContent.toLowerCase().includes(value) ? "" : "none");
}
</script>
