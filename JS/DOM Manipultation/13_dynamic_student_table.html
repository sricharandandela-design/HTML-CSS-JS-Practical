<!DOCTYPE html>
<html>
<body>
<h3>Student Table</h3>
<table border="1" cellpadding="8">
<thead><tr><th>Name</th><th>Roll No</th><th>Marks</th></tr></thead>
<tbody id="students"></tbody>
</table>
<script>
const students = [
    {name:"Charan", roll:"101", marks:85},
    {name:"Rahul", roll:"102", marks:90},
    {name:"Anu", roll:"103", marks:78}
];
students.forEach(s => {
    const row = document.createElement("tr");
    row.innerHTML = `<td>${s.name}</td><td>${s.roll}</td><td>${s.marks}</td>`;
    document.getElementById("students").appendChild(row);
});
</script>
