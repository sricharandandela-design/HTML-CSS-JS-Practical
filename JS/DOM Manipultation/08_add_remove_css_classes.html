<!DOCTYPE html>
<html>
<head>
<style>.highlight{background:yellow;color:red;padding:10px}</style>
</head>
<body>
<p id="text">CSS class demonstration</p>
<button onclick="addClass()">Add Class</button>
<button onclick="removeClass()">Remove Class</button>
<script>
const text = document.getElementById("text");
function addClass(){ text.classList.add("highlight"); }
function removeClass(){ text.classList.remove("highlight"); }
</script>
