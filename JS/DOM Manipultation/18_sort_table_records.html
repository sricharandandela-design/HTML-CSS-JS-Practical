<!DOCTYPE html>
<html>
<body>
<table border="1" id="table">
<thead><tr><th onclick="sortTable()">Name ▲</th><th>Marks</th></tr></thead>
<tbody>
<tr><td>Charan</td><td>85</td></tr>
<tr><td>Anu</td><td>95</td></tr>
<tr><td>Rahul</td><td>75</td></tr>
</tbody>
</table>
<script>
function sortTable() {
    const tbody = document.querySelector("#table tbody");
    const rows = [...tbody.rows];
    rows.sort((a,b) => a.cells[0].textContent.localeCompare(b.cells[0].textContent));
    rows.forEach(row => tbody.appendChild(row));
}
</script>
