<button onclick="toggle(this)">What is DOM?</button>
<div class="answer">DOM represents the structure of an HTML document as objects.</div>
<script>
function toggle(button) {
    const answer = button.nextElementSibling;
    answer.style.display = answer.style.display === "block" ? "none" : "block";
}
</script>
