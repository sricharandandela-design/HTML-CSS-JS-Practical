<!DOCTYPE html>
<html>
<body>
<h3>Image Gallery</h3>
<div id="gallery"></div>
<script>
const images = [
    {src:"https://picsum.photos/200/130?1", alt:"Image 1"},
    {src:"https://picsum.photos/200/130?2", alt:"Image 2"},
    {src:"https://picsum.photos/200/130?3", alt:"Image 3"}
];
images.forEach(item => {
    const img = document.createElement("img");
    img.src = item.src;
    img.alt = item.alt;
    img.style.margin = "5px";
    document.getElementById("gallery").appendChild(img);
});
</script>
