<!DOCTYPE html>

<body>
<p id="old">Old element</p>
<button onclick="replaceElement()">Replace</button>
<script>
function replaceElement() {
    const newEl = document.createElement("h2");
    newEl.textContent = "New replacement element";
    document.getElementById("old").replaceWith(newEl);
}
</script>
