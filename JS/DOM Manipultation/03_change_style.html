<!DOCTYPE html>
<html>
<body>
<p id="text">Change my style.</p>
<button onclick="changeStyle()">Change Style</button>
<script>
function changeStyle() {
    const el = document.getElementById("text");
    el.style.fontSize = "30px";
    el.style.fontWeight = "bold";
    el.style.color = "blue";
}
</script>

<div style="
    margin: 20px 0;
    padding: 12px;
    text-align: center;
    background: #f4f6f8;
    border-radius: 10px;
">

       style="
       display:inline-block;
       margin-right:10px;
       padding:10px 18px;
       background:#2563eb;
       color:white;
       text-decoration:none;
       border-radius:7px;
       font-weight:bold;
       ">
       Home
    </a>

    <a href="index.html"
       style="

</div>

</body>
</html>
