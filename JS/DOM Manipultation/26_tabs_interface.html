<!DOCTYPE html>
<html>
<head><style>
.tabcontent{display:none;padding:15px;border:1px solid #aaa}
button{margin:3px}
</style></head>
<body>
<button onclick="openTab('one')">Tab 1</button>
<button onclick="openTab('two')">Tab 2</button>
<button onclick="openTab('three')">Tab 3</button>
<div id="one" class="tabcontent">Content of Tab 1</div>
<div id="two" class="tabcontent">Content of Tab 2</div>
<div id="three" class="tabcontent">Content of Tab 3</div>
<script>
function openTab(id) {
    document.querySelectorAll(".tabcontent").forEach(el => el.style.display="none");
    document.getElementById(id).style.display="block";
}
openTab("one");
</script>
