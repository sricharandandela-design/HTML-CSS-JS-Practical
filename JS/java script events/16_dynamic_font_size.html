<!DOCTYPE html>
<html><body>
<p id="text">This text changes size.</p>
<button onclick="increase()">Increase</button>
<button onclick="decrease()">Decrease</button>
<script>
let size=20;
function increase(){ size+=2; document.getElementById("text").style.fontSize=size+"px"; }
function decrease(){ size=Math.max(10,size-2); document.getElementById("text").style.fontSize=size+"px"; }
</script>
