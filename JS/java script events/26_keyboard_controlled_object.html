<!DOCTYPE html>
<html><head><style>
#area{position:relative;width:500px;height:300px;border:1px solid black}
#box{position:absolute;width:40px;height:40px;background:tomato;left:0;top:0}
</style></head><body>
<div id="area"><div id="box"></div></div>
<script>
let x=0,y=0;
document.addEventListener("keydown",function(e){
    if(e.key==="ArrowRight") x+=10;
    if(e.key==="ArrowLeft") x-=10;
    if(e.key==="ArrowDown") y+=10;
    if(e.key==="ArrowUp") y-=10;
    x=Math.max(0,Math.min(460,x)); y=Math.max(0,Math.min(260,y));
    document.getElementById("box").style.left=x+"px";
    document.getElementById("box").style.top=y+"px";
});
</script>

    margin: 20px 0;
    padding: 12px;
    text-align: center;

">
