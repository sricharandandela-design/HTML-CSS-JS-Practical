<!DOCTYPE html>
<html><body>
<h2>Reaction Time Game</h2>
<p id="msg">Click Start, then wait for the box to turn green.</p>
<button id="start">Start</button>
<div id="box" style="width:200px;height:100px;background:red;margin-top:20px;"></div>
<script>
let startTime, timer, waiting=false;
document.getElementById("start").onclick=function(){
    waiting=true;
    document.getElementById("box").style.background="red";
    document.getElementById("msg").textContent="Wait...";
    const delay=1000+Math.random()*3000;
    timer=setTimeout(()=>{
        startTime=performance.now();
        document.getElementById("box").style.background="green";
        document.getElementById("msg").textContent="Click the green box!";
    },delay);
};
document.getElementById("box").onclick=function(){
    if(!waiting) return;
    if(!startTime){ clearTimeout(timer); document.getElementById("msg").textContent="Too early! Click Start again."; waiting=false; return; }
    const time=Math.round(performance.now()-startTime);
    document.getElementById("msg").textContent="Reaction time: "+time+" ms";
    waiting=false; startTime=null;
};
</script>
