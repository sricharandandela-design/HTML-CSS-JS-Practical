<html><body>
<div id="parent" style="padding:30px;background:#ddd;">
Parent
<button id="child">Child</button>
</div>
<p id="msg"></p>
<script>
document.getElementById("parent").addEventListener("click",()=>document.getElementById("msg").textContent="Parent handler ran after child (bubbling).");
document.getElementById("child").addEventListener("click",()=>document.getElementById("msg").textContent="Child clicked.");
</script>
