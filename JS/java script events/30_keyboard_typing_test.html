<!DOCTYPE html>
<html><body>
<h2>Keyboard Typing Test</h2>
<p id="target">JavaScript events make web pages interactive.</p>
<textarea id="input" rows="5" cols="60" placeholder="Type the sentence above..."></textarea>
<p>Time: <span id="time">0</span> seconds</p>
<p id="result"></p>
<script>
let seconds=0, timer=null, started=false;
const input=document.getElementById("input");
input.addEventListener("input",function(){
    if(!started){
        started=true;
        timer=setInterval(()=>document.getElementById("time").textContent=++seconds,1000);
    }
    if(input.value === document.getElementById("target").textContent){
        clearInterval(timer);
        document.getElementById("result").textContent="Completed in "+seconds+" seconds!";
    }
});
</script>
