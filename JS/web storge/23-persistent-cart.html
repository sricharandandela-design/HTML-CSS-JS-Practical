<h2>Persistent Cart</h2><button onclick="add('Laptop')">Add Laptop</button><button onclick="clearCart()">Clear</button><p id="out"></p><script>
let cart=JSON.parse(localStorage.getItem("persistentCart")||"[]");function add(x){cart.push(x);save()}function clearCart(){cart=[];save()}function save(){localStorage.setItem("persistentCart",JSON.stringify(cart));out.textContent=cart.join(", ")}save();
</script>
