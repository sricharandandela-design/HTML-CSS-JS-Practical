<h2>To-Do List</h2><input id="task" placeholder="Enter task"><button onclick="add()">Add</button><ul id="list"></ul><script>
let tasks=JSON.parse(localStorage.getItem("tasks")||"[]");function render(){list.innerHTML="";tasks.forEach((t,i)=>{let li=document.createElement("li");li.textContent=t+" ";let b=document.createElement("button");b.textContent="Delete";b.onclick=()=>{tasks.splice(i,1);save()};li.appendChild(b);list.appendChild(li)})}function add(){if(task.value.trim()){tasks.push(task.value.trim());task.value="";save()}}function save(){localStorage.setItem("tasks",JSON.stringify(tasks));render()}render();
</script>
