<h2>CRUD with localStorage</h2><input id="name" placeholder="Name"><button onclick="create()">Create</button><ul id="list"></ul><script>
let records=JSON.parse(localStorage.getItem("records")||"[]");function render(){list.innerHTML="";records.forEach((r,i)=>{let li=document.createElement("li");li.textContent=r.name+" ";let e=document.createElement("button");e.textContent="Edit";e.onclick=()=>{let x=prompt("New name",r.name);if(x){r.name=x;save()}};let d=document.createElement("button");d.textContent="Delete";d.onclick=()=>{records.splice(i,1);save()};li.append(e,d);list.append(li)})}function create(){if(name.value.trim()){records.push({name:name.value.trim()});name.value="";save()}}function save(){localStorage.setItem("records",JSON.stringify(records));render()}render();
</script>
