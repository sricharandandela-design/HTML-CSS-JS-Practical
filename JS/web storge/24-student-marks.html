<h2>Student Marks</h2><input id="name" placeholder="Name"><input id="marks" placeholder="Marks"><button onclick="save()">Save</button><p id="out"></p><script>
let db=JSON.parse(localStorage.getItem("marksDB")||"[]");function save(){db.push({name:name.value,marks:marks.value});localStorage.setItem("marksDB",JSON.stringify(db));show()}function show(){out.innerHTML=db.map(s=>s.name+" - "+s.marks).join("<br>")}show();
</script>
