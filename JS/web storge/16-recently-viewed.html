<h2>Recently Viewed</h2><button onclick="view('Product A')">View A</button><button onclick="view('Product B')">View B</button><p id="out"></p><script>
let items=JSON.parse(localStorage.getItem("recent")||"[]");function view(x){items=[x,...items.filter(i=>i!==x)].slice(0,5);localStorage.setItem("recent",JSON.stringify(items));show()}function show(){out.textContent=items.join(" | ")}show();
</script>
