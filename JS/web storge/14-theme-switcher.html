<button onclick="toggle()">Toggle Dark/Light</button><script>
function apply(){document.body.style.background=localStorage.getItem("theme")==="dark"?"#222":"white";document.body.style.color=localStorage.getItem("theme")==="dark"?"white":"black"}function toggle(){localStorage.setItem("theme",localStorage.getItem("theme")==="dark"?"light":"dark");apply()}apply();
</script>
