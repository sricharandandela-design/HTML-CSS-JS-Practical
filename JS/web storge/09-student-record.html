<h2>Student Record</h2><input id="name" placeholder="Name"><input id="mark" placeholder="Marks"><button onclick="save()">Save</button><p id="out"></p><script>
function save(){localStorage.setItem("student",JSON.stringify({name:name.value,marks:mark.value}));show()}function show(){let s=JSON.parse(localStorage.getItem("student")||"{}");out.textContent=s.name?s.name+" - "+s.marks:"No record";}show();
</script>
